<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captain Dark's Ghost Fleet - Twilight Treasure Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Patrick+Hand&family=Pirata+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --ocean-deep: #16243b;
      --ocean-mid: #253d5e;
      --ocean-light: #3e6088;
      --sand-dusk: #e0be84;
      --ghost-glow: #00ffc4;
      --lava-red: #ff3838;
      --gold: #ffd32a;
      --border-outer: #0f1724;
      --ink: #111a24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* FULL PAGE CENTERING */
    body {
      background: radial-gradient(circle at 50% 40%, #151d28 0%, #080b10 100%);
      font-family: 'Patrick Hand', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      color: #e0f2fe;
      overflow-x: hidden;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      margin: auto;
    }

    /* PIRATE SLOGAN BANNER */
    .slogan-capsule {
      background: linear-gradient(90deg, #881337, #b91c1c, #881337);
      border: 2.5px solid #fda4af;
      border-radius: 30px;
      padding: 5px 22px;
      margin-bottom: 8px;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: glowSlogan 3s infinite alternate ease-in-out;
    }

    @keyframes glowSlogan {
      0% { box-shadow: 0 0 15px rgba(225, 29, 72, 0.3); }
      100% { box-shadow: 0 0 25px rgba(0, 255, 196, 0.4); }
    }

    .slogan-text {
      font-family: 'Bangers', cursive;
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      letter-spacing: 2.5px;
      color: var(--gold);
      text-shadow: 
        3px 3px 0px #7f1d1d,
        -1.5px -1.5px 0px #000,
        1.5px -1.5px 0px #000,
        -1.5px 1.5px 0px #000,
        0 0 25px rgba(255, 211, 42, 0.4);
      margin-bottom: 4px;
    }

    .sub-bar {
      display: flex;
      gap: 12px;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: bold;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 3px 14px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* CENTERED POSTER FRAME */
    .stamp-container {
      position: relative;
      background: #0b1118;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 255, 196, 0.15);
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border: 2px solid #1e293b;
    }

    .map-frame {
      border: 5px solid #1e2e42;
      border-radius: 10px;
      position: relative;
      background: radial-gradient(circle at 45% 45%, var(--ocean-light) 0%, var(--ocean-mid) 50%, var(--ocean-deep) 100%);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    svg.art-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ANIMATIONS FOR MAP OBJECTS */
    .galleon-bob {
      animation: galleonRock 4s infinite ease-in-out alternate;
      transform-origin: 180px 240px;
    }

    @keyframes galleonRock {
      0% { transform: rotate(-2.5deg) translateY(-5px); }
      100% { transform: rotate(2.5deg) translateY(5px); }
    }

    .whale-swim {
      animation: whaleFloat 5s infinite ease-in-out alternate;
    }

    @keyframes whaleFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-7px) scale(1.02); }
    }

    /* FLOATING & BUBBLING LAVA ANIMATIONS */
    .floating-lava-blob1 {
      animation: lavaBlobFloat1 2.4s infinite ease-in-out alternate;
    }
    .floating-lava-blob2 {
      animation: lavaBlobFloat2 3.1s infinite ease-in-out alternate;
    }
    .floating-lava-stream {
      animation: lavaStreamPulse 1.8s infinite alternate ease-in-out;
    }

    @keyframes lavaBlobFloat1 {
      0% { transform: translateY(0) scale(0.9); opacity: 0.9; }
      50% { transform: translateY(-16px) scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #ff4757); }
      100% { transform: translateY(-30px) scale(0.8); opacity: 0.4; }
    }

    @keyframes lavaBlobFloat2 {
      0% { transform: translate(0, 0) scale(1.1); opacity: 0.8; }
      50% { transform: translate(-8px, -20px) scale(1.3); opacity: 1; filter: drop-shadow(0 0 10px #ffa502); }
      100% { transform: translate(4px, -36px) scale(0.6); opacity: 0.3; }
    }

    @keyframes lavaStreamPulse {
      0% { filter: drop-shadow(0 0 2px #ff4757); }
      100% { filter: drop-shadow(0 0 12px #ffa502); }
    }

    /* BUZZARD BEACH RAIN ANIMATION */
    .rain-layer {
      stroke: #a5f3fc;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.75;
      animation: rainFall 0.75s linear infinite;
    }

    @keyframes rainFall {
      0% { transform: translate(0, -30px); opacity: 0; }
      50% { opacity: 0.85; }
      100% { transform: translate(-15px, 35px); opacity: 0; }
    }

    .water-ripple {
      animation: rippleFade 4s infinite alternate ease-in-out;
    }

    @keyframes rippleFade {
      0% { opacity: 0.15; }
      100% { opacity: 0.45; }
    }

    /* FLOATING GHOST SHIP AVATAR GUIDE */
    #ghostAvatar {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
      transition: left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 10px var(--ghost-glow));
    }

    /* 24 ROADMAP CLICKABLE PINS */
    .waypoint-pin {
      position: absolute;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #1e293b;
      border: 2.5px solid #94a3b8;
      color: #f8fafc;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    /* LOCKED STATE */
    .waypoint-pin.locked {
      background: #0f172a;
      border-color: #334155;
      color: #64748b;
      cursor: not-allowed;
      opacity: 0.65;
      font-size: 0.85rem;
      box-shadow: none;
    }

    /* ACTIVE CURRENT STEP */
    .waypoint-pin.unlocked-current {
      background: var(--gold);
      border-color: #000;
      color: #000;
      box-shadow: 0 0 20px rgba(255, 211, 42, 0.9);
      animation: pulseCurrent 1.4s infinite alternate;
    }

    @keyframes pulseCurrent {
      0% { transform: translate(-50%, -50%) scale(1.05); }
      100% { transform: translate(-50%, -60%) scale(1.28); }
    }

    /* PREVIOUSLY VISITED */
    .waypoint-pin.visited {
      background: #059669;
      color: #fff;
      border-color: var(--ghost-glow);
      box-shadow: 0 0 12px rgba(0, 255, 196, 0.5);
    }

    .waypoint-pin:not(.locked):hover {
      transform: translate(-50%, -58%) scale(1.35);
      z-index: 35;
    }

    .waypoint-pin.final-spot {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #e11d48, #9f1239);
      color: #fff;
      font-size: 1.5rem;
      border: 3px solid #fff;
      box-shadow: 0 0 25px #e11d48;
    }

    /* STORYBOOK POPUP MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 9, 15, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(6px);
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .storybook-card {
      background: #1e293b;
      border: 4px solid #475569;
      border-radius: 24px;
      max-width: 460px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 255, 196, 0.2);
      animation: popJump 0.25s ease-out;
      color: #f1f5f9;
    }

    @keyframes popJump {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .tag-bubble {
      display: inline-block;
      background: #e11d48;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.05rem;
      padding: 4px 18px;
      border-radius: 20px;
      margin-bottom: 10px;
      box-shadow: 0 3px 0 #881337;
    }

    .card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.7rem;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    .card-clue-box {
      font-size: 1.25rem;
      line-height: 1.45;
      color: #e2e8f0;
      background: #0f172a;
      border: 2px dashed #475569;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      min-height: 80px;
    }

    .btn-wrap {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-act {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      border: 2.5px solid #0f172a;
      padding: 8px 22px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-done { background: #10b981; color: #022c22; box-shadow: 0 3px 0 #047857; }
    .btn-done:hover { transform: translateY(-2px); }

    .btn-close { background: #f59e0b; color: #451a03; box-shadow: 0 3px 0 #b45309; }
    .btn-close:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- PIRATE SLOGAN BANNER -->
    <div class="slogan-capsule">
      <span>☠️</span>
      <span class="slogan-text" id="sloganBanner">"DEAD MEN TELL NO TALES!"</span>
      <span>🕯️</span>
    </div>

    <header>
      <h1>CAPTAIN DARK'S GHOST FLEET</h1>
      <div class="sub-bar">
        <div class="stat-pill">🧭 Waypoints: <span id="progressText" style="color:var(--gold)">0 / 24</span></div>
        <div class="stat-pill" style="cursor:pointer;" onclick="resetProgress()">🔄 Reset Voyage</div>
      </div>
    </header>

    <!-- CENTERED POSTER FRAME -->
    <div class="stamp-container">
      <div class="map-frame" id="mapZone">
        
        <!-- SVG ARTWORK -->
        <svg class="art-canvas" viewBox="0 0 1000 1000">
          <defs>

          <!-- 3. ANIMATED GHOST SHIP (Top Left) -->

            <path d="M 0,165 Q 40,150 80,165 Q 120,150 160,165 Q 200,150 240,165 Q 270,150 300,165" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

            <ellipse cx="90" cy="72" rx="15" ry="9" fill="#a8a29e" stroke="#1c1917" stroke-width="3"/>

  <!-- POPUP CARD FOR CLUES (READ-ONLY) -->
  <div class="modal-overlay" id="cluePopup">
    <div class="storybook-card">
      <div class="tag-bubble" id="stepTag">WAYPOINT 1</div>
      <h2 class="card-title" id="stepTitle">The Ghost Galleon's Wake</h2>
      
      <div class="card-clue-box" id="stepClueText">
        <!-- Clue text inserted dynamically -->
      </div>

      <div class="btn-wrap">
        <button class="btn-act btn-done" id="markBtn" onclick="toggleCompleted()">Mark Found ✔</button>
        <button class="btn-act btn-close" onclick="closeClue()">Close Map</button>
      </div>
    </div>
  </div>

  <script>
    // Slogans Rotator
    const slogans = [
      `"DEAD MEN TELL NO TALES!"`,
      `"SAIL WITH THE GHOST FLEET AT TWILIGHT!"`,
      `"NOT ALL TREASURE IS SILVER & GOLD!"`,
      `"SEIZE THE TIDES, CLAIM THE FINAL CHEST!"`
    ];
    let sloganIdx = 0;
    setInterval(() => {
      sloganIdx = (sloganIdx + 1) % slogans.length;
      document.getElementById('sloganBanner').textContent = `"${slogans[sloganIdx]}"`;
    }, 4000);

    // =========================================================
    // 🗺️ 24 WAYPOINTS & HARDCODED CLUES
    // =========================================================
    const waypoints = [
      { id: 1,  x: 33.0, y: 37.0, name: "The Ghost Galleon's Wake", clue: "dedbaratek" },
      { id: 2,  x: 39.0, y: 36.0, name: "Sea Sprayer Shoals", clue: "No Clue Yet" },
      { id: 3,  x: 45.0, y: 34.0, name: "Whale Song Passage", clue: "No Clue Yet" },
      { id: 4,  x: 51.5, y: 31.0, name: "Rum Runner North Shore", clue: "No Clue Yet" },
      { id: 5,  x: 58.5, y: 30.5, name: "Palm Shade Haven", clue: "No Clue Yet" },
      { id: 6,  x: 65.0, y: 33.5, name: "Barrel Beach", clue: "No Clue Yet" },
      { id: 7,  x: 70.0, y: 38.0, name: "Pirates Cove Lookout", clue: "No Clue Yet" },
      { id: 8,  x: 73.5, y: 42.0, name: "Smuggler's Mooring", clue: "No Clue Yet" },
      { id: 9,  x: 73.0, y: 47.0, name: "Top Spires Ridge", clue: "No Clue Yet" },
      { id: 10, x: 68.5, y: 50.5, name: "Rock Run High Pass", clue: "No Clue Yet" },
      { id: 11, x: 63.5, y: 53.5, name: "Pebble Point", clue: "No Clue Yet" },
      { id: 12, x: 58.0, y: 56.0, name: "Shark Fin Trench", clue: "No Clue Yet" },
      { id: 13, x: 52.0, y: 58.0, name: "Buzzard Overlook", clue: "No Clue Yet" },
      { id: 14, x: 44.0, y: 56.0, name: "Monkey Bay Crossing", clue: "No Clue Yet" },
      { id: 15, x: 39.5, y: 59.5, name: "Jungle Fringe Creek", clue: "No Clue Yet" },
      { id: 16, x: 42.0, y: 68.5, name: "Alligator Snout Bank", clue: "No Clue Yet" },
      { id: 17, x: 48.5, y: 73.5, name: "Volcano Base Camp", clue: "No Clue Yet" },
      { id: 18, x: 56.0, y: 74.0, name: "Brimstone Trail", clue: "No Clue Yet" },
      { id: 19, x: 62.0, y: 70.5, name: "Smoldering Rocks", clue: "No Clue Yet" },
      { id: 20, x: 68.0, y: 69.5, name: "Tide Pool Straits", clue: "No Clue Yet" },
      { id: 21, x: 74.0, y: 70.0, name: "Bone Key Gate", clue: "No Clue Yet" },
      { id: 22, x: 78.0, y: 66.0, name: "Treasure Coast Sands", clue: "No Clue Yet" },
      { id: 23, x: 81.0, y: 68.0, name: "Crossbones Flagstaff", clue: "No Clue Yet" },
      { id: 24, x: 84.0, y: 72.0, name: "The Captain's Chest (X)", clue: "🏆 No Clue Yet" }
    ];

    let visitedWaypoints = JSON.parse(localStorage.getItem('twilight_map_progress')) || [];
    let activeWp = null;

    const mapZone = document.getElementById('mapZone');
    const ghostAvatar = document.getElementById('ghostAvatar');
    const popup = document.getElementById('cluePopup');
    const stepTag = document.getElementById('stepTag');
    const stepTitle = document.getElementById('stepTitle');
    const stepClueText = document.getElementById('stepClueText');
    const markBtn = document.getElementById('markBtn');
    const progressText = document.getElementById('progressText');

    function renderPins() {
      document.querySelectorAll('.waypoint-pin').forEach(el => el.remove());

      const currentUnlockedId = visitedWaypoints.length + 1;

      waypoints.forEach(wp => {
        const pin = document.createElement('button');
        const isFinal = wp.id === 24;
        const isVisited = visitedWaypoints.includes(wp.id);
        const isUnlockedCurrent = (wp.id === currentUnlockedId);
        const isLocked = wp.id > currentUnlockedId;

        pin.className = `waypoint-pin ${isFinal ? 'final-spot' : ''} ${isVisited ? 'visited' : ''} ${isUnlockedCurrent ? 'unlocked-current' : ''} ${isLocked ? 'locked' : ''}`;
        pin.style.left = `${wp.x}%`;
        pin.style.top = `${wp.y}%`;

        if (isLocked) {
          pin.innerHTML = '🔒';
          pin.title = `Locked - Complete Waypoint #${wp.id - 1} first!`;
        } else if (isFinal && isVisited) {
          pin.innerHTML = '👑';
          pin.title = wp.name;
        } else if (isFinal) {
          pin.innerHTML = '☠️';
          pin.title = wp.name;
        } else if (isVisited) {
          pin.innerHTML = '✔';
          pin.title = wp.name;
        } else {
          pin.innerHTML = wp.id;
          pin.title = wp.name;
        }

        if (!isLocked) {
          pin.onclick = () => openClue(wp);
        }

        mapZone.appendChild(pin);
      });

      progressText.textContent = `${visitedWaypoints.length} / 24`;
      
      const targetNode = waypoints.find(w => w.id === currentUnlockedId) || waypoints[23];
      moveGhost(targetNode);
    }

    function moveGhost(wp) {
      if (!wp) return;
      ghostAvatar.style.left = `${wp.x}%`;
      ghostAvatar.style.top = `${wp.y}%`;
    }

    function openClue(wp) {
      activeWp = wp;
      moveGhost(wp);

      stepTag.textContent = `WAYPOINT #${wp.id} OF 24`;
      stepTitle.textContent = wp.name;
      stepClueText.textContent = wp.clue || "No clue text inscribed here yet...";

      const isDone = visitedWaypoints.includes(wp.id);
      markBtn.textContent = isDone ? "Found ✔" : "Mark Found ✔";
      markBtn.style.opacity = isDone ? "0.65" : "1.0";

      popup.classList.add('active');

      if (wp.id === 24 && isDone) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      }
    }

    function toggleCompleted() {
      if (!activeWp) return;
      if (!visitedWaypoints.includes(activeWp.id)) {
        visitedWaypoints.push(activeWp.id);
        localStorage.setItem('twilight_map_progress', JSON.stringify(visitedWaypoints));
        
        if (activeWp.id === 24) {
          confetti({ particleCount: 140, spread: 85, origin: { y: 0.6 } });
        } else {
          confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
        }
      }
      renderPins();
      closeClue();
    }

    function closeClue() {
      popup.classList.remove('active');
    }

    function resetProgress() {
      if (confirm("Reset voyage back to Waypoint #1?")) {
        visitedWaypoints = [];
        localStorage.removeItem('twilight_map_progress');
        renderPins();
      }
    }

    popup.addEventListener('click', (e) => {
      if (e.target === popup) closeClue();
    });

    renderPins();
  </script>
